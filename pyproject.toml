[project]
name = "chainermin"
version = "2.0.0"
description = "Minimal Chainer"
readme = "README.md"
authors = [
    { name = "tsurumeso", email = "tsurumeso@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cupy-cuda13x[ctk]>=14.2.0",
    "ipadic>=1.0.0",
    "mecab-python3>=1.0.12",
    "numpy>=2.5.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chainermin"]

[tool.ruff]
line-length = 120

[dependency-groups]
dev = [
    "ruff>=0.16.5",
]
